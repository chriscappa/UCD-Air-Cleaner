; PlatformIO Project Configuration File
; Distributed Multi-Channel Fan Air Cleaner (AC) Network
; Architecture: ESP32-S3 | Framework: Arduino Core (Pinned v2.0.14/Platform v6.5.0)

[platformio]
default_envs = esp32s3_master
description = Production firmware for distributed distributed PWM Fan Air Cleaner network.

[env]
platform = espressif32 @ 6.5.0
framework = arduino
board = esp32-s3-devkitc-1

; Hardware-Specific Configuration Flags
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; Partition Mapping for OTA, NVS Space, and High-Capacity Application Code
board_build.partitions = huge_app.csv

; Serial Port Interfacing Configuration (USB-C plaintext CLI alignment)
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time, colorize
upload_speed = 921600

; Global Build Flags and Preprocessor Directives
build_flags = 
    -D CORE_DEBUG_LEVEL=3                   ; Info level logging (log_i, log_w, log_e enabled)
    -D ARDUINO_USB_CDC_ON_BOOT=1            ; Redirects Serial to the native hardware USB-C port
    -D ARDUINO_USB_MODE=1

; External Dependency Management
lib_deps =
    bblanchon/ArduinoJson @ 7.0.4          ; High-performance JSON parser for Cloud REST syncing

; =============================================================================
; ENVIRONMENT CAPTURES: Server/Master Target Build
; =============================================================================
[env:esp32s3_master]
extends = env
build_flags = 
    ${env.build_flags}
    -D DEVICE_IS_MASTER=1

; =============================================================================
; ENVIRONMENT CAPTURES: Client/Slave Target Build
; =============================================================================
[env:esp32s3_slave]
extends = env
build_flags = 
    ${env.build_flags}
    -D DEVICE_IS_MASTER=0
